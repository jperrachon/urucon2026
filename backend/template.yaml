AWSTemplateFormatVersion: "2010-09-09"
Description: URUCON CFP submission API and storage resources

Parameters:
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
  LambdaCodeS3Key:
    Type: String
    Description: S3 key for the Lambda deployment package
  CfpSubmissionBucketName:
    Type: String
    Description: S3 bucket where submitted papers will be stored
  CfpCorsOrigin:
    Type: String
    Default: "*"
    Description: Allowed origin for CFP API CORS responses

Resources:
  CfpSubmissionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CfpSubmissionBucketName
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref CfpCorsOrigin
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
              - x-amz-request-id
              - x-amz-id-2
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CfpSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH

  CfpSubmissionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CfpSubmissionDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt CfpSubmissionsTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${CfpSubmissionsBucket.Arn}/*"

  CfpSubmissionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: urucon-cfp-submission-api
      Runtime: python3.12
      Handler: cfp_handler.lambda_handler
      Role: !GetAtt CfpSubmissionLambdaRole.Arn
      Timeout: 20
      MemorySize: 256
      Environment:
        Variables:
          SUBMISSIONS_BUCKET: !Ref CfpSubmissionsBucket
          SUBMISSIONS_TABLE: !Ref CfpSubmissionsTable
          CORS_ORIGIN: !Ref CfpCorsOrigin
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  CfpHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: urucon-cfp-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref CfpCorsOrigin
        AllowMethods:
          - OPTIONS
          - POST
          - GET
        AllowHeaders:
          - Content-Type

  CfpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CfpHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CfpSubmissionLambda.Arn
      PayloadFormatVersion: "2.0"

  CfpApiRouteSubmission:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CfpHttpApi
      RouteKey: POST /api/cfp/submission-url
      Target: !Sub integrations/${CfpApiIntegration}

  CfpApiRouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CfpHttpApi
      RouteKey: GET /api/cfp/health
      Target: !Sub integrations/${CfpApiIntegration}

  CfpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CfpHttpApi
      StageName: prod
      AutoDeploy: true

  CfpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CfpSubmissionLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CfpHttpApi}/*/*/*"

Outputs:
  CfpApiBaseUrl:
    Description: Base URL for CFP API
    Value: !Sub "https://${CfpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CfpSubmissionBucketName:
    Description: Bucket storing submitted papers
    Value: !Ref CfpSubmissionsBucket
  CfpSubmissionsTableName:
    Description: DynamoDB table storing submission metadata
    Value: !Ref CfpSubmissionsTable
